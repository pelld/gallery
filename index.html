<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Gallery</title>
  <link rel="stylesheet" href="./styles.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="viewer" aria-label="Interactive 3D gallery"></main>

  <section id="loadingPanel" class="status-panel" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="status-content">
      <div class="status-row">
        <strong>Loading gallery</strong>
        <span id="progressText"></span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar indeterminate"></div>
      </div>
      <div id="loadingDetail" class="status-detail">Building room and loading detailed CC0 assets…</div>
    </div>
  </section>

  <section id="errorPanel" class="error-panel" role="alert" hidden>
    <strong>Unable to build the gallery</strong>
    <p id="errorMessage">The browser could not initialise the 3D scene.</p>
  </section>

  <div id="controlHint" class="control-hint" hidden>
    Drag to look around · Scroll/pinch to zoom · Click a painting to focus
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
